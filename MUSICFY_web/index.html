<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>musicboxd - Início</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/styles.css">
</head>
<body>
    <!-- Navegação -->
    <nav style="background: linear-gradient(to top right, #7c9bf0, #59f3cd);" class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">musicboxd</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Explorar</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container my-5">
        
        <!-- Seção de Álbuns / Posts -->
        <h3 class="mb-3">Álbuns Populares</h3>
        <div class="row g-4">
            
            <div class="col-md-4">
                <div style="border-color: #ffff; border-width: 2px;" class="card h-100 rounded-5">
                    <img src="src/img/SOUR_OliviaRodrigo_cover.jpg" class="card-img-top rounded-top-5" alt="Álbum">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">SOUR</h5>
                        <p class="card-text text-muted">Olivia Rodrigo</p>
                    </div>
                    <button class="botao-avaliar">
                        Avalie
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div style="border-color: #ffff; border-width: 2px;" class="card h-100 rounded-5">
                    <img src="src/img/petal_cover.jpg" class="card-img-top rounded-top-5" alt="Álbum">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Petal</h5>
                        <p class="card-text text-muted">Ariana Grande</p>
                    </div>
                    <button class="botao-avaliar">
                        Avalie
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div style="border-color: #ffff; border-width: 2px;" class="card h-100 rounded-5">
                    <img src="src/img/SoCloseToWhat_Tate_cover.jpg" class="card-img-top rounded-top-5" alt="Álbum">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">So Close to What</h5>
                        <p class="card-text text-muted">Tate Mcrae</p>
                    </div>
                    <button class="botao-avaliar">
                        Avalie
                    </button>
                </div>
            </div> 
        </div>

    </main>
    

    <footer class="bg-light py-3 text-center">
        MUSICFY - todos os direitos reservados
    </footer>

    <script src="src/scripts/script.js" defer></script>
</body>
</html>
