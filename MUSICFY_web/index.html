<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>musicboxd - Início</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/styles.css">
</head>
<body>
    <!-- Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">musicboxd</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Explorar</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container my-5">
        
        <!-- Seção de Álbuns / Posts -->
        <h3 class="mb-3">Álbuns Populares</h3>
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="album-card card h-100 rounded-4" style="cursor: pointer;">
                    <img src="src/img/SOUR_OliviaRodrigo_cover.jpg" class="card-img-top rounded-top-4" alt="Álbum SOUR de Olivia Rodrigo">
                    <div class="card-body">
                        <h5 class="card-title">SOUR</h5>
                        <p class="card-text text-muted">Olivia Rodrigo</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="album-card card h-100 rounded-4" style="cursor: pointer;">
                    <img src="" class="card-img-top rounded-top-4" alt="Álbum Petal de Ariana Grande">
                    <div class="card-body">
                        <h5 class="card-title">Petal</h5>
                        <p class="card-text text-muted">Ariana Grande</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="album-card card h-100 rounded-4" style="cursor: pointer;">
                    <img src="" class="card-img-top rounded-top-4" alt="Álbum So Close to What de Tate McRae">
                    <div class="card-body">
                        <h5 class="card-title">So Close to What</h5>
                        <p class="card-text text-muted">Tate Mcrae</p>
                    </div>
                </div>
            </div> 
        </div>
    </main>

    <div class="modal fade" id="albumModal" tabindex="-1" aria-labelledby="albumModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="albumModalLabel">Avaliar álbum</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row align-items-center">
                        <div class="col-md-4 text-center">
                            <img id="modalImg" src="" alt="Capa do álbum" class="img-fluid rounded-3 mb-3 mb-md-0">
                        </div>
                        <div class="col-md-8">
                            <h3 id="modalTitle" class="mb-1"></h3>
                            <p id="modalArtist" class="text-muted mb-3"></p>

                            <form id="reviewForm">
                                <div class="mb-3">
                                    <label for="rating" class="form-label">Sua avaliação</label>
                                    <select id="rating" class="form-select" required>
                                        <option value="">Selecione</option>
                                        <option value="5">5 - Excelente</option>
                                        <option value="4">4 - Muito bom</option>
                                        <option value="3">3 - Bom</option>
                                        <option value="2">2 - Regular</option>
                                        <option value="1">1 - Ruim</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="reviewText" class="form-label">Comentário</label>
                                    <textarea id="reviewText" class="form-control" rows="4" placeholder="Conte o que você achou do álbum..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Salvar avaliação</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
