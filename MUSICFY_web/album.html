<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>musicboxd - Álbum</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/styles.css" />
</head>
<body>
  <!-- Navegação -->
  <nav style="background: linear-gradient(to top right, #7c9bf0, #59f3cd);" class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">musicboxd</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Explorar</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <a href="index.html" class="btn btn-link text-primary mb-4">← Voltar para os álbuns</a>

    <section class="album-card p-4 p-md-5">
      <div class="row align-items-center">
        <div class="col-md-4 text-center">
          <img id="albumCover" src="" alt="Capa do álbum" class="img-fluid rounded-4 shadow-sm" style="max-width: 280px;" />
        </div>

        <div class="col-md-8">
          <p class="text-primary fw-bold mb-2">Álbum</p>
          <h1 id="albumName" class="display-6 fw-bold mb-2">Carregando...</h1>
          <p id="albumArtist" class="fs-5 text-muted mb-4">Artista</p>

          <button id="avaliarAlbumBtn" class="btn btn-primary btn-lg px-4" type="button">
            AVALIAR
          </button>
        </div>
      </div>
    </section>

    <section class="mt-5">
      <h3 class="mb-3">Faixas</h3>
      <div id="trackList" class="mb-4"></div>
    </section>

    <section class="mt-4">
      <h3 class="mb-3">Avaliações das faixas</h3>
      <div id="trackReviews"></div>
    </section>

    <section id="reviewForm" class="mt-5 bg-white rounded-4 p-4 shadow-sm">
      <h4 class="mb-3">Avaliar este álbum</h4>
      <form id="albumReviewForm">
        <div class="mb-3">
          <label for="albumRating" class="form-label">Sua nota</label>
          <select id="albumRating" class="form-select" required>
            <option value="">Selecione</option>
            <option value="5">5 - Excelente</option>
            <option value="4">4 - Muito bom</option>
            <option value="3">3 - Bom</option>
            <option value="2">2 - Regular</option>
            <option value="1">1 - Ruim</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="albumReviewText" class="form-label">Seu comentário</label>
          <textarea id="albumReviewText" class="form-control" rows="4" placeholder="O que você achou do álbum?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Salvar avaliação</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="src/scripts/script.js"></script>
</body>
</html>
