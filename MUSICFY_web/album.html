<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>musicboxd - Álbum</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to bottom, #edf6ff, #dcefff);
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #1d2a3a;
      margin: 0;
    }

    .container {
      max-width: 1100px;
    }

    .text-primary {
      color: #7c9bf0 !important;
    }

    .btn-primary {
      background: linear-gradient(to top right, #7c9bf0, #59f3cd);
      border: none;
      box-shadow: none;
      color: #fff;
    }

    .btn-primary:hover {
      filter: brightness(0.98);
    }

    .album-card {
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      margin: 0 auto;
    }

    .album-card .row {
      display: flex;
      align-items: center;
      margin: 0;
    }

    .album-card img {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }

    .album-card h1,
    .album-card p,
    .album-card h3,
    .album-card h4,
    .album-card label,
    .track-item,
    .card-body {
      margin: 0;
    }

    .track-item {
      border: 1px solid #dfeaf7;
      border-radius: 12px;
      margin-bottom: 10px;
      padding: 12px 16px;
      background: #fff;
      line-height: 1.4;
    }

    .track-item strong {
      display: block;
      margin-bottom: 4px;
      color: #1d2a3a;
    }

    .card {
      border-radius: 14px;
      border: 1px solid #e5eef9;
    }

    .card-body {
      padding: 16px 18px;
    }

    #reviewForm {
      margin-top: 30px;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <main class="container my-5">
    <a href="index.html" class="btn btn-link text-primary mb-4">← Voltar para os álbuns</a>

    <section class="album-card p-4 p-md-5">
      <div class="row align-items-center">
        <div class="col-md-4 text-center">
          <img id="albumCover" src="" alt="Capa do álbum" class="img-fluid rounded-4 shadow-sm" style="max-width: 280px;" />
        </div>

        <div class="col-md-8">
          <p class="text-primary fw-bold mb-2">Álbum</p>
          <h1 id="albumName" class="display-6 fw-bold mb-2">Carregando...</h1>
          <p id="albumArtist" class="fs-5 text-muted mb-4">Artista</p>

          <button id="avaliarAlbumBtn" class="btn btn-primary btn-lg px-4" type="button">
            AVALIAR
          </button>
        </div>
      </div>
    </section>

    <section class="mt-5">
      <h3 class="mb-3">Faixas</h3>
      <div id="trackList" class="mb-4"></div>
    </section>

    <section class="mt-4">
      <h3 class="mb-3">Avaliações das faixas</h3>
      <div id="trackReviews"></div>
    </section>

    <section id="reviewForm" class="mt-5 bg-white rounded-4 p-4 shadow-sm">
      <h4 class="mb-3">Avaliar este álbum</h4>
      <form id="albumReviewForm">
        <div class="mb-3">
          <label for="albumRating" class="form-label">Sua nota</label>
          <select id="albumRating" class="form-select" required>
            <option value="">Selecione</option>
            <option value="5">5 - Excelente</option>
            <option value="4">4 - Muito bom</option>
            <option value="3">3 - Bom</option>
            <option value="2">2 - Regular</option>
            <option value="1">1 - Ruim</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="albumReviewText" class="form-label">Seu comentário</label>
          <textarea id="albumReviewText" class="form-control" rows="4" placeholder="O que você achou do álbum?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Salvar avaliação</button>
      </form>
    </section>
  </main>

  <script type="module" src="src/scripts/script.js"></script>
</body>
</html>
