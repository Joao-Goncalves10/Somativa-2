services:
  - type: web
    name: musicfy
    runtime: node
    plan: free
    rootDir: MUSICFY_web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
